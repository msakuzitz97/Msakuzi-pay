<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Msakuzi Admin</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--line:#2a2f3a;--tx:#e8eaf0;--mut:#9aa3b2;--ok:#22c55e;--no:#e11d2e;--warn:#f59e0b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:21px;margin:6px 0 12px}
input{width:100%;padding:14px;border-radius:10px;border:1px solid var(--line);background:#0f1115;color:var(--tx);font-size:16px;margin-top:8px}
.btn{border:0;border-radius:10px;padding:12px 16px;font-size:15px;font-weight:700;color:#fff;background:#2a2f3a;cursor:pointer}
.btn.ok{background:var(--ok);color:#06210f}.btn.no{background:var(--no)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.mut{color:var(--mut);font-size:13px}
.tag{font-size:12px;padding:3px 8px;border-radius:999px;border:1px solid var(--line)}
.pending{color:var(--warn);border-color:var(--warn)}.approved{color:var(--ok);border-color:var(--ok)}.rejected{color:#ff6b6b;border-color:#ff6b6b}
.actions{display:flex;gap:8px;margin-top:10px}.actions .btn{flex:1}
.err{color:#ff6b6b;min-height:18px;font-size:14px}
.hide{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <h1>Msakuzi - Uthibitisho wa malipo</h1>

  <div id="login" class="card">
    <b>Ingia</b>
    <input id="email" type="email" placeholder="Email ya admin" autocomplete="username">
    <input id="pass" type="password" placeholder="Nenosiri" autocomplete="current-password">
    <div class="err" id="loginErr"></div>
    <button class="btn ok" id="loginBtn" style="width:100%;margin-top:8px">Ingia</button>
  </div>

  <div id="panel" class="hide">
    <div class="row"><span class="mut" id="stamp"></span>
      <span><button class="btn" id="refresh">Onyesha upya</button> <button class="btn" id="logout">Toka</button></span></div>
    <div id="list"></div>
  </div>
</div>

<script>
// ====== CONFIG: same values as index.html ======
const SUPABASE_URL = "https://zpxbflsvivjxkchnojeh.supabase.co";
const SUPABASE_KEY = "sb_publishable_Ow5glyTelDjDTonCQX4aOg_gH0QGWvT";
// ===============================================

const LABELS = {m3:"Dakika 3", m15:"Dakika 15", m30:"Dakika 30", h1:"Saa 1", vip:"VIP - Siku nzima"};
const $ = id => document.getElementById(id);
let jwt = sessionStorage.getItem("msakuzi_admin_jwt") || "", timer = null;

async function api(path, body, bearer){
  const headers = {"Content-Type":"application/json", apikey: SUPABASE_KEY};
  const bt = bearer || (SUPABASE_KEY.startsWith("eyJ") ? SUPABASE_KEY : "");
  if (bt) headers.Authorization = "Bearer " + bt;
  const r = await fetch(SUPABASE_URL + path, {method:"POST", headers, body: JSON.stringify(body || {})});
  const txt = await r.text();
  if (!r.ok) throw new Error(txt);
  return txt ? JSON.parse(txt) : null;
}

$("loginBtn").onclick = async () => {
  $("loginErr").textContent = "";
  try {
    const r = await api("/auth/v1/token?grant_type=password", {email: $("email").value.trim(), password: $("pass").value});
    jwt = r.access_token; sessionStorage.setItem("msakuzi_admin_jwt", jwt);
    openPanel();
  } catch(e){ $("loginErr").textContent = "Email au nenosiri si sahihi."; }
};
$("logout").onclick = () => { sessionStorage.removeItem("msakuzi_admin_jwt"); jwt = ""; clearInterval(timer); $("panel").classList.add("hide"); $("login").classList.remove("hide"); };
$("refresh").onclick = load;

function openPanel(){
  $("login").classList.add("hide"); $("panel").classList.remove("hide");
  load(); clearInterval(timer); timer = setInterval(load, 8000);
}
function ago(iso){
  const s = Math.floor((Date.now() - new Date(iso)) / 1000);
  if (s < 60) return s + " sek zilizopita";
  if (s < 3600) return Math.floor(s/60) + " dak zilizopita";
  return Math.floor(s/3600) + " saa zilizopita";
}
async function load(){
  try {
    const rows = await api("/rest/v1/rpc/admin_list", {}, jwt);
    const list = $("list"); list.innerHTML = "";
    if (!rows.length) list.innerHTML = '<div class="card mut">Hakuna maombi bado.</div>';
    rows.forEach(r => {
      const c = document.createElement("div"); c.className = "card";
      const top = document.createElement("div"); top.className = "row";
      const nm = document.createElement("b"); nm.textContent = r.payer_name;
      const tg = document.createElement("span"); tg.className = "tag " + r.status; tg.textContent = r.status;
      top.append(nm, tg);
      const info = document.createElement("div"); info.className = "mut";
      info.textContent = (LABELS[r.plan_code] || r.plan_code) + " | " + Number(r.amount).toLocaleString("en-US") + " TSh | " + ago(r.created_at);
      c.append(top, info);
      if (r.status === "pending") {
        const a = document.createElement("div"); a.className = "actions";
        const ok = document.createElement("button"); ok.className = "btn ok"; ok.textContent = "Confirm";
        const no = document.createElement("button"); no.className = "btn no"; no.textContent = "Reject";
        ok.onclick = () => decide(r, "approved");
        no.onclick = () => decide(r, "rejected");
        a.append(ok, no); c.append(a);
      }
      list.appendChild(c);
    });
    $("stamp").textContent = "Imesasishwa " + new Date().toLocaleTimeString();
  } catch(e){
    $("stamp").textContent = "Kikao kimeisha au huna ruhusa. Toka kisha ingia tena.";
  }
}
async function decide(r, status){
  const word = status === "approved" ? "THIBITISHA" : "KATAA";
  if (!confirm(word + ": " + r.payer_name + " - " + Number(r.amount).toLocaleString("en-US") + " TSh?\nHakikisha pesa imeingia kwenye akaunti yako.")) return;
  try { await api("/rest/v1/rpc/admin_set_status", {p_id: r.id, p_status: status}, jwt); load(); }
  catch(e){ alert("Imeshindikana. Jaribu tena."); }
}
if (jwt) openPanel();
</script>
</body>
</html>
